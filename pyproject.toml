[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-transit-demand-forecasting"
version = "0.2.0"
description = "Foundation for hierarchical urban transit demand forecasting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.21,<5", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
transit-demand = "transit_demand.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
