name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality-and-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -c requirements-demo.txt -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest
      - run: python -m transit_demand quality data/examples/validations.csv --manifest data/examples/delivery-manifest.json --catalog data/examples/station-catalog.json
      - run: python -m transit_demand demo --output artifacts/synthetic-demo
      - run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-demo-python-${{ matrix.python-version }}
          path: artifacts/synthetic-demo/
          if-no-files-found: error
          retention-days: 14
